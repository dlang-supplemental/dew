name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

# DUB versions: GitHub webhook → code.dlang.org (no DUB_REGISTRY_* secrets required).
# Owner ops (register / categories / logo) stay on local dubx or a one-shot workflow_dispatch.

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: linux-x64
            artifact: dew-gallery
          - os: ubuntu-24.04-arm
            triplet: linux-arm64
            artifact: dew-gallery
          - os: windows-latest
            triplet: windows-x64
            artifact: dew-gallery.exe
          - os: windows-11-arm
            triplet: windows-arm64
            artifact: dew-gallery.exe
          - os: macos-14
            triplet: macos-arm64
            artifact: dew-gallery
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest
      - name: Stamp version
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if [ -n "$ver" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "$ver" > VERSION
          fi
          echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"
      - name: Build gallery
        run: dub build --compiler=ldc2 --build=release
        working-directory: examples/gallery
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.triplet }}"
          if [ -f "examples/gallery/${{ matrix.artifact }}" ]; then
            cp "examples/gallery/${{ matrix.artifact }}" "dist/${{ matrix.triplet }}/"
          elif [ -f "examples/gallery/dew-gallery" ]; then
            cp examples/gallery/dew-gallery "dist/${{ matrix.triplet }}/"
          elif [ -f "examples/gallery/dew-gallery.exe" ]; then
            cp examples/gallery/dew-gallery.exe "dist/${{ matrix.triplet }}/"
          else
            find examples/gallery -maxdepth 2 -type f -name 'dew-gallery*' -print
            exit 1
          fi
      - name: Windows installer (Inno)
        if: matrix.triplet == 'windows-x64'
        shell: pwsh
        run: |
          choco install innosetup -y
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows\dew-gallery.iss
          if (Test-Path dist\windows-x64\dew-gallery-setup.exe) {
            Copy-Item dist\windows-x64\dew-gallery-setup.exe "dist\${{ matrix.triplet }}\"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.triplet }}
          path: dist/${{ matrix.triplet }}/**

  pack:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: slices
      - name: Zip slices
        shell: bash
        run: |
          mkdir -p release
          for d in slices/app-*; do
            trip=${d#slices/app-}
            (cd "$d" && zip -r "../../release/dew-gallery-${trip}.zip" .)
          done
          # Prefer installer from windows-x64 staging if present inside the zip tree
          find slices -name 'dew-gallery-setup.exe' -exec cp {} release/ \;
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
