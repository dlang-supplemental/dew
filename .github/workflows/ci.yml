name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triplet: linux-x64
          - os: ubuntu-24.04-arm
            triplet: linux-arm64
          - os: windows-latest
            triplet: windows-x64
          - os: windows-11-arm
            triplet: windows-arm64
          - os: macos-14
            triplet: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: dew
    steps:
      - name: Checkout dew
        uses: actions/checkout@v4
        with:
          path: dew
      # DUB validates path deps in every configuration; gpu pins ../vello-d.
      - name: Checkout vello-d sibling
        uses: actions/checkout@v4
        with:
          repository: dlang-supplemental/vello-d
          ref: cursor/draw-text-0.1.4
          path: vello-d
      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest
      - name: Test headless
        run: dub test -c headless --compiler=ldc2
      - name: Build library
        run: dub build -c headless --compiler=ldc2 --build=release
      - name: Build gallery
        run: dub build --compiler=ldc2 --build=release
        working-directory: dew/examples/gallery
